<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Odie puck</title>
<style>
  :root { --off: #ff5a5a; --odie: #f5a524; --his: #6cc6ff; --card: #15171c; --edge: #2a2e36; --ink: #e9e6df; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  #wrap { position: absolute; right: 6px; bottom: 6px; display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; }
  #face { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--odie); background: center/cover url(odie.png); cursor: pointer;
          box-shadow: 0 4px 14px rgba(0,0,0,.6); opacity: .85; transition: transform .15s, opacity .15s; }
  #face:hover { opacity: 1; transform: scale(1.06); }
  body.drawing #face { border-color: var(--his); box-shadow: 0 0 0 4px rgba(108,198,255,.22), 0 4px 14px rgba(0,0,0,.6); opacity: 1; }
  #tools { display: none; flex-direction: column; gap: 6px; padding: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--edge); }
  body.open #tools { display: flex; }
  .sep { height: 1px; background: var(--edge); margin: 2px 4px; }
  button { position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: #1d2027; color: var(--ink); font: 18px/1 "Segoe UI Symbol", "Segoe UI"; cursor: pointer; }
  button:hover { border-color: var(--edge); background: #252932; }
  button.on { border-color: var(--his); color: var(--his); background: #17222b; }
  button:disabled { opacity: .3; cursor: default; }
  #t-send:not(:disabled) { background: var(--odie); color: #15171c; font-weight: 700; }
  #t-send:not(:disabled):hover { filter: brightness(1.1); }
  #count { position: absolute; top: -6px; left: -6px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: var(--his); color: #0d1116; font: 700 11px/18px "Segoe UI"; display: none; }
  /* Connected or not, readable at a glance: amber ring = I'm listening, pulsing amber = I'm on it, grey face + red ring + a label = nobody's listening. */
  body.link-busy #face { animation: busy 1.6s ease-in-out infinite; }
  @keyframes busy { 50% { box-shadow: 0 0 0 6px rgba(245,165,36,.28), 0 4px 14px rgba(0,0,0,.6); } }
  body.link-off #face { border-color: var(--off); filter: grayscale(1) brightness(.75); opacity: 1; box-shadow: 0 0 0 4px rgba(255,90,90,.25), 0 4px 14px rgba(0,0,0,.6); }
  #link { position: absolute; right: 62px; bottom: 16px; padding: 6px 10px; border-radius: 8px; background: var(--card); color: var(--ink);
          font: 600 13px/1 "Segoe UI", system-ui; white-space: nowrap; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.6); }
  body.link-off #link { display: block; border: 1px solid var(--off); }
  body.link-off #link b { color: var(--off); }
  body.link-waiting #link { display: block; border: 1px solid var(--odie); }
  body.link-waiting #link b { color: var(--odie); }
  body.open #link { display: none; }
  /* The palette: four colors that each mean something, and a size. */
  #sw { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 5px; width: 38px; height: 38px; box-sizing: border-box; border-radius: 10px; background: #1d2027; }
  #sw i { display: block; border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  #sw i.on { box-shadow: 0 0 0 2px #fff; }
  #t-size b { display: block; margin: auto; border-radius: 50%; background: var(--ink); }
  #tip { position: absolute; right: 64px; padding: 4px 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--edge); color: var(--ink); font-size: 12px; white-space: nowrap; display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="face"></div>
  <div id="tools">
    <button id="t-pen" data-tip="Pen (right-click to stop)">✎</button>
    <button id="t-box" data-tip="Box: Odie reads everything inside">▭</button>
    <button id="t-ellipse" data-tip="Circle: Odie reads everything inside">◯</button>
    <button id="t-hl" data-tip="Highlighter: Odie reads exactly these words">▍</button>
    <button id="t-arrow" data-tip="Arrow: this goes there">↗</button>
    <button id="t-step" data-tip="Numbered steps: do these in order">①</button>
    <button id="t-hide" data-tip="Hide: blacked out of everything Odie sees">▦</button>
    <button id="t-note" data-tip="Note where you click">T</button>
    <div class="sep"></div>
    <div id="sw"><i data-c="blue" data-tip="Blue: this"></i><i data-c="red" data-tip="Red: wrong, cut this"></i><i data-c="green" data-tip="Green: good, keep this"></i><i data-c="yellow" data-tip="Yellow: look here"></i></div>
    <button id="t-size" data-tip="Size"><b></b></button>
    <button id="t-undo" data-tip="Undo your last mark" disabled>↶</button>
    <div class="sep"></div>
    <button id="t-send" data-tip="Send your marks to Odie" disabled>➤<span id="count"></span></button>
    <button id="t-den" data-tip="Send this screen to the Den">⤓</button>
    <button id="t-clear" data-tip="Clear the glass">⌫</button>
  </div>
</div>
<div id="link"></div>
<div id="tip"></div>
<script>
// The puck is its own little window, so it takes clicks the ordinary way.
const tip = document.getElementById('tip'), $ = id => document.getElementById(id);
const AI = new URLSearchParams(location.search).get('ai') || 'Odie';
document.querySelectorAll('[data-tip]').forEach(b => b.dataset.tip = b.dataset.tip.replace(/Odie/g, AI));
let mode = 'off', pending = 0, closeT;
const stayOpen = () => mode !== 'off' || pending > 0;
function open(on) { clearTimeout(closeT); document.body.classList.toggle('open', on); host.puckOpen(on); }
$('wrap').addEventListener('mouseenter', () => open(true));
$('wrap').addEventListener('mouseleave', () => { if (!stayOpen()) closeT = setTimeout(() => open(false), 500); tip.style.display = 'none'; });
// The face says whether I'm listening in the puck's own label, to its left, so nothing covers the face.
$('face').addEventListener('mouseenter', () => { const f = $('face'), r = f.getBoundingClientRect(); if (!f.dataset.tip) return; tip.textContent = f.dataset.tip; tip.style.display = 'block'; tip.style.top = (r.top + 14) + 'px'; });
$('face').addEventListener('mouseleave', () => tip.style.display = 'none');
document.querySelectorAll('button, #sw i').forEach(b => {
  b.addEventListener('mouseenter', () => { const r = b.getBoundingClientRect(); tip.textContent = b.dataset.tip; tip.style.display = 'block'; tip.style.top = (r.top + 9) + 'px'; });
  b.addEventListener('mouseleave', () => tip.style.display = 'none');
});
function show(m) {
  mode = m; document.body.classList.toggle('drawing', m !== 'off');
  ['pen', 'box', 'ellipse', 'hl', 'arrow', 'step', 'hide', 'note'].forEach(k => $('t-' + k).classList.toggle('on', m === k));
  if (stayOpen()) open(true); else closeT = setTimeout(() => open(false), 800);
}
const pick = m => host.mode(mode === m ? 'off' : m);
$('face').addEventListener('click', () => pick('pen'));
$('t-pen').addEventListener('click', () => pick('pen'));
$('t-box').addEventListener('click', () => pick('box'));
$('t-note').addEventListener('click', () => pick('note'));
['ellipse', 'hl', 'arrow', 'step', 'hide'].forEach(k => $('t-' + k).addEventListener('click', () => pick(k)));
// Picking a color with no tool on starts the pen in it.
const HEX = { blue: '#6cc6ff', red: '#ff5a5a', green: '#3fd37a', yellow: '#ffd23f' }, SIZES = [6, 10, 15];
let sty = { color: 'blue', size: 1, step: 1 };
document.querySelectorAll('#sw i').forEach(i => { i.style.background = HEX[i.dataset.c]; i.addEventListener('click', () => { host.style({ color: i.dataset.c }); if (mode === 'off') host.mode('pen'); }); });
$('t-size').addEventListener('click', () => host.style({ size: (sty.size + 1) % 3 }));
function paint() {
  document.querySelectorAll('#sw i').forEach(i => i.classList.toggle('on', i.dataset.c === sty.color));
  const b = $('t-size').querySelector('b'), d = SIZES[sty.size]; b.style.width = b.style.height = d + 'px'; b.style.background = HEX[sty.color];
  $('t-step').textContent = '①②③④⑤⑥⑦⑧⑨'[Math.min(sty.step, 9) - 1];
  document.documentElement.style.setProperty('--his', HEX[sty.color]);
}
host.onStyle(s => { sty = s; paint(); }); paint();
$('t-undo').addEventListener('click', () => host.undo());
$('t-send').addEventListener('click', () => host.send());
$('t-den').addEventListener('click', () => host.drop('From the glass'));
$('t-clear').addEventListener('click', () => host.clear());
host.onMode(show);
host.onPending(n => {
  pending = n; $('t-undo').disabled = n === 0; $('t-send').disabled = n === 0;
  $('count').textContent = n; $('count').style.display = n ? 'block' : 'none';
  if (stayOpen()) open(true);
});
host.onLink(({ state, unread }) => {
  const b = document.body;
  b.classList.toggle('link-off', state === 'off');
  b.classList.toggle('link-busy', state === 'busy');
  b.classList.toggle('link-waiting', state !== 'off' && unread > 0);
  const many = unread === 1 ? '1 send' : `${unread} sends`;
  $('link').innerHTML = state === 'off'
    ? (unread ? `<b>●</b> ${AI}'s not connected · ${many} waiting` : `<b>●</b> ${AI}'s not connected`)
    : unread ? `<b>●</b> ${many} waiting for ${AI}` : '';
  $('face').dataset.tip = state === 'on' ? `${AI}'s listening` : state === 'busy' ? `${AI}'s on it` : `${AI}'s not connected: open a chat and it'll pick up what you sent`;
});
</script>
</body>
</html>
